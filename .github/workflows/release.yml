name: Release fonts

# Packages the fonts straight from the committed fonts/ — no build step, so a
# release never depends on Actions minutes or npm availability.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package font archives from committed fonts/
        run: |
          mkdir -p release
          cp LICENSE fonts/LICENSE
          for dir in fonts/icons-*; do
            folder="${dir#fonts/}"          # icons-bootstrap
            set="${folder#icons-}"          # bootstrap
            (
              cd fonts
              zip -qr "$OLDPWD/release/insales-icons-${set}-${GITHUB_REF_NAME}.zip" "$folder" LICENSE
            )
          done
          rm fonts/LICENSE
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
